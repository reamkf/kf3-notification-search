name = "kf3notif-restore-operator"
main = "./scripts/restore-worker.ts"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[dev]
ip = "127.0.0.1"
port = 8790
local_protocol = "http"

[[kv_namespaces]]
binding = "KF3_NOTIF_CACHE"
id = "07df384a6c6e40039d42e663e6a13b7a"
remote = true

[[r2_buckets]]
binding = "KF3_NOTIF_DATA"
bucket_name = "kf3-notif-data"
remote = true

[[r2_buckets]]
binding = "KF3_NOTIF_BACKUP"
bucket_name = "kf3-notif-backup"
remote = true
