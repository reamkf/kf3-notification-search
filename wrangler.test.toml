name = "kf3notif-test"
main = "./app/worker.ts"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat", "rpc"]

[[kv_namespaces]]
binding = "KF3_NOTIF_CACHE"
id = "test-kf3-notif-cache"

[[r2_buckets]]
binding = "KF3_NOTIF_DATA"
bucket_name = "test-kf3-notif-data"

[[r2_buckets]]
binding = "KF3_NOTIF_BACKUP"
bucket_name = "test-kf3-notif-backup"

[[queues.producers]]
binding = "KF3_ARCHIVE_UPDATE_QUEUE"
queue = "kf3-notif-archive-update"

[[queues.consumers]]
queue = "kf3-notif-archive-update"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3
max_concurrency = 1

[[durable_objects.bindings]]
name = "KF3_REFRESH_COORDINATOR"
class_name = "NewsRefreshCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NewsRefreshCoordinator"]
